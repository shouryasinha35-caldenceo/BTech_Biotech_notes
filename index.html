<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAR BTech Biotechnology | Study Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <div class="chat-btn" onclick="toggleChat()">💬</div>
  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">Calden AI Assistant</div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg bot">Hi! I'm your study assistant. Ask me anything about Engineering Mathematics-1 or other subjects.</div>
    </div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Ask a question..." onkeypress="if(event.key==='Enter')sendChat()">
      <button class="primary" style="width:auto;margin-left:0.5rem" onclick="sendChat()">Send</button>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
